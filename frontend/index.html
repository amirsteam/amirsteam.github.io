<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved or system theme before the page paints, so dark-mode
         visitors don't see a flash of the light theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Amir Bahadur Shrestha | MERN Stack Developer &amp; Educator in Nepal</title>
    <meta name="description" content="I build web apps that businesses and schools run on: online stores, school systems and course platforms with React, Node.js and MongoDB. Based in Nepal, working remotely." />
    <meta name="author" content="Amir Bahadur Shrestha" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.amirlearner.me/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->

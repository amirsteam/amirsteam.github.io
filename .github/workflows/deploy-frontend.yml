name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
  # Sent by the CMS "Publish site" button
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # A lint error stops the deploy, so broken code never goes live
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Pull published content from the CMS API (repository variable CONTENT_API_URL,
      # e.g. https://amirlearner-api.onrender.com/api). Skipped when it isn't set.
      - name: Fetch CMS content
        working-directory: frontend
        env:
          CONTENT_API_URL: ${{ vars.CONTENT_API_URL }}
        run: npm run fetch-content

      - name: Build with environment variables
        working-directory: frontend
        env:
          # Where the /admin dashboard sends requests
          VITE_API_URL: ${{ vars.CONTENT_API_URL }}
          # Public Web3Forms access key for the contact form (safe to commit).
          # Leave empty and the form offers email/WhatsApp buttons instead.
          VITE_WEB3FORMS_KEY: ''
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

